<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orbit Vibe</title><script src="/orbit-theme.js"></script><link rel="stylesheet" href="/gaming.css"><link rel="stylesheet" href="/orbit-theme.css"><link rel="stylesheet" href="/navigation.css"><link rel="stylesheet" href="/vibe.css"></head><body>
<header><div><h1>Orbit Vibe</h1><p>Moments that move with you</p></div><div class="arena-account-row"><button id="vibePlay">Orbit Play</button><button id="vibeMarket"><img src="/navigation-icons/orbit-market-icon.svg" alt="" width="24" height="24">Orbit Market</button></div></header>
<main><nav aria-label="Vibe audience"><button id="publicVibe" aria-pressed="true">Public Vibe</button><button id="privateVibe" aria-pressed="false">Private Vibe</button></nav><p id="vibeStatus" role="status"></p>
<details id="vibeCompose"><summary>Add to your Vibe</summary><form id="vibeUpload"><label>Photos or videos<input id="vibeFiles" type="file" multiple accept="image/jpeg,image/png,video/mp4,video/webm" required></label><label>Caption<input id="vibeCaption" maxlength="500"></label><fieldset id="vibeAudience" hidden><legend>Private recipients · existing contacts only</legend><div id="vibeContacts"></div></fieldset><button type="submit" id="publishVibe">Publish Vibe</button><p>Each upload has its own expiry. Photos up to 5 MB; videos up to 20 MB and 60 seconds.</p></form></details>
<details><summary>Vibe expiration settings</summary><form id="vibePreferences"><label>Public Vibe<select id="publicHours"><option>12</option><option selected>24</option><option>48</option></select>hours</label><label>Private Vibe<select id="privateHours"><option>12</option><option selected>24</option><option>48</option></select>hours</label><button>Save expiration settings</button><p>Applies to new uploads; existing expiration times stay unchanged.</p></form></details>
<section id="vibeFeed" aria-live="polite"></section>
<nav id="vibeFooter" class="orbit-bottom-nav" aria-label="Main navigation"><button id="vibeTab" aria-label="Vibe" aria-selected="true"><img src="/navigation-icons/vibe-icon.svg" alt=""></button><button id="vibeChat"><img src="/navigation-icons/chat-icon.svg" alt=""><span>Chat</span></button><button id="vibeCalls"><img src="/navigation-icons/call-icon.svg" alt=""><span>Calls</span></button><button id="vibeProfile"><img src="/navigation-icons/profile-icon.svg" alt=""><span>Profile</span></button></nav></main>
<dialog id="vibeViewer"><button id="closeVibe" aria-label="Close Vibe">‹</button><div id="vibeMedia"></div><p id="vibeCaptionView"></p><div id="vibeReactions"></div><button id="replyVibe">Chat / Reply privately</button></dialog><script src="/activity-ui.js"></script><script src="/vibe.js?v=27"></script></body></html>
