<!doctype html><html><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/call-screen.css"><link rel="stylesheet" href="/orbit-theme.css"><style>body{margin:0}button{background:var(--orbit-action);color:white;border:0;position:relative;overflow:hidden}button::after{content:'';position:absolute;inset:-30% auto -30% -80%;width:45%;background:linear-gradient(90deg,transparent,#fff6,transparent);transform:skewX(-25deg)}button.pressed::after{animation:sweep .5s}@keyframes sweep{to{left:140%}}button:active{transform:scale(.97)}[hidden]{display:none!important}@media(prefers-reduced-motion:reduce){button.pressed::after{animation:none}button:active{transform:none}}</style><link rel="stylesheet" href="/form-panels.css"><script defer src="/form-panels.js"></script><body><main class="call-screen"><div id="callPhoto" class="call-photo"></div><h2 id="callName">Voice call</h2><p id="callStatus">Ready</p><div id="callTimer" class="call-timer">00:00</div><div id="callVideos" hidden><video id="remoteCallVideo" autoplay playsinline muted></video><div id="localVideoTile" aria-label="Drag your video preview"><video id="localCallVideo" autoplay playsinline muted></video><button id="hideLocalVideo" type="button" aria-label="Hide your preview">‹</button></div><button id="restoreLocalVideo" type="button" aria-label="Show your preview" hidden>›</button></div><div class="call-tools"><button id="callCamera" hidden>Camera off</button><button id="flipCamera" hidden>Flip camera</button><button id="muteCall" hidden>Mute</button><button id="callSpeaker" hidden>Speaker off</button><button id="callAudio" hidden>Enable audio</button></div><button id="closeCall" class="call-close" hidden>Back to chat</button><div class="call-actions"><button id="answerCall" class="call-answer" aria-label="Accept call" hidden><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M6.62 10.79a15.053 15.053 0 0 0 6.59 6.59l2.2-2.2a.996.996 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1C10.61 21 3 13.39 3 4c0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02z"/></svg></button><button id="endCall" class="call-end" aria-label="End call"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.29-.7.29-.28 0-.53-.11-.71-.29L.29 13.8a.996.996 0 0 1 0-1.41C3.34 9.68 7.46 8 12 8s8.66 1.68 11.71 4.39a.996.996 0 0 1 0 1.41l-2.48 1.77c-.18.18-.43.29-.71.29-.27 0-.52-.11-.7-.29-.79-.73-1.68-1.36-2.66-1.85-.33-.16-.56-.51-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/></svg></button></div></main><script src="/calls.js"></script><script src="/call-screen.js"></script><script>
const session=JSON.parse(GuardianNative.session());document.documentElement.dataset.theme=session.bright?'bright':'dark';const request=async(path,body)=>{const r=await fetch(path,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+session.token,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'Call failed');return data};const callView=new GuardianCallView({native:true,finished:()=>GuardianNative.finished(),self:()=>session.id,client:()=>client,request,peer:()=>({id:session.peer,name:session.name})});const client=new GuardianVoice({self:()=>session.id,enabled:()=>!document.hidden,request,onState:s=>{callView.render(s);GuardianNative.callStage(s.status);if(s.status.startsWith('Incoming '))GuardianNative.ringing();else GuardianNative.silenceRing();if(s.call)GuardianNative.activeCall(s.call.id)}});window.voiceClient=client;document.getElementById('callCamera').onclick=()=>client.camera(true);document.getElementById('flipCamera').onclick=()=>client.camera(false);document.getElementById('answerCall').onclick=()=>client.accept();document.getElementById('muteCall').onclick=()=>client.mute();document.getElementById('callSpeaker').onclick=()=>callView.output();document.getElementById('callAudio').onclick=()=>client.audio.play();document.getElementById('endCall').onclick=()=>client.end();document.getElementById('closeCall').onclick=()=>GuardianNative.finished();if(!session.incoming)client.start(session.peer,session.video?'video':'audio');document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){b.classList.remove('pressed');void b.offsetWidth;b.classList.add('pressed')}});document.addEventListener('visibilitychange',()=>{if(document.hidden&&!GuardianNative.awaitingAudioPermission()){if(!client.pc&&client.call?.state==='ringing'&&client.call.recipient===session.id)client.cleanup();else client.end()}});</script></body></html>
