<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Vibe icon">
<defs>
<linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#8B3DFF"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="core" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#C7D2FE"/></radialGradient>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/><rect width="512" height="512" rx="112" fill="url(#glow)"/>
<!-- fading rings: the vibe spreading out and fading over 24 hours -->
<circle cx="256" cy="256" r="196" fill="none" stroke="#22D3EE" stroke-width="12" stroke-linecap="round" stroke-dasharray="150 60 220 70 140 80" opacity="0.35" transform="rotate(20 256 256)"/>
<circle cx="256" cy="256" r="146" fill="none" stroke="#22D3EE" stroke-width="14" stroke-linecap="round" stroke-dasharray="190 48 230 56" opacity="0.65" transform="rotate(-30 256 256)"/>
<circle cx="256" cy="256" r="100" fill="none" stroke="#FFFFFF" stroke-width="16" stroke-linecap="round" stroke-dasharray="260 40 220 30" opacity="0.95" transform="rotate(60 256 256)"/>
<!-- core with a spark -->
<circle cx="256" cy="256" r="56" fill="url(#core)"/>
<path d="M256 222c3 20 14 31 34 34-20 3-31 14-34 34-3-20-14-31-34-34 20-3 31-14 34-34z" fill="#6D28D9"/>
<!-- orbiting dot -->
<circle cx="404" cy="132" r="17" fill="#FFB822"/>
</svg>
