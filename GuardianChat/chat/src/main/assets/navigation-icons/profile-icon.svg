<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Profile icon">
<defs>
<linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
<radialGradient id="glow" cx="0.3" cy="0.2" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0.28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="fig" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D7DEFF"/></linearGradient>
<clipPath id="squircle"><rect width="512" height="512" rx="112"/></clipPath>
<clipPath id="front"><rect x="0" y="190" width="512" height="200"/></clipPath>
</defs>
<rect width="512" height="512" rx="112" fill="url(#bg)"/><rect width="512" height="512" rx="112" fill="url(#glow)"/>
<g clip-path="url(#squircle)">
<!-- orbit ring behind the figure -->
<g transform="rotate(-22 256 210)"><ellipse cx="256" cy="210" rx="170" ry="56" fill="none" stroke="#22D3EE" stroke-width="12" opacity="0.9"/></g>
<!-- shoulders and head -->
<path d="M96 512v-70c0-90 70-150 160-150s160 60 160 150v70z" fill="url(#fig)"/>
<circle cx="256" cy="190" r="82" fill="url(#fig)"/>
<!-- ring passes in front of the head -->
<g transform="rotate(-22 256 210)"><g clip-path="url(#front)"><ellipse cx="256" cy="210" rx="170" ry="56" fill="none" stroke="#22D3EE" stroke-width="12"/></g></g>
</g>
<!-- online dot -->
<circle cx="392" cy="104" r="20" fill="#FFFFFF"/><circle cx="392" cy="104" r="11" fill="#34D399"/>
</svg>
